<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔓 أبو شنب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .container {
            max-width: 950px;
            width: 100%;
            background: #141424;
            border-radius: 24px;
            padding: 30px 25px;
            border: 1px solid #2a2a4a;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(124,58,237,0.05);
        }
        h1 {
            text-align: center;
            font-size: 2.2rem;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
        }
        .sub {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 15px;
        }
        .badge {
            background: #1a1a3a;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.6rem;
            color: #a855f7;
            border: 1px solid #2a2a4a;
            white-space: nowrap;
        }
        .badge.external {
            color: #4ade80;
            border-color: #4ade80;
        }
        textarea {
            width: 100%;
            height: 170px;
            padding: 14px;
            background: #0d0d1a;
            border: 1px solid #2a2a4a;
            border-radius: 14px;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            resize: vertical;
            transition: border 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168,85,247,0.1);
        }
        .buttons {
            display: flex;
            gap: 12px;
            margin: 18px 0;
            flex-wrap: wrap;
        }
        .buttons button {
            flex: 1;
            min-width: 100px;
            padding: 14px 18px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        .btn-decrypt {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            box-shadow: 0 4px 20px rgba(124,58,237,0.3);
        }
        .btn-decrypt:active { transform: scale(0.96); }
        .btn-copy {
            background: #1a2a3a;
            color: #94a3b8;
            border: 1px solid #2a4a4a;
        }
        .btn-clear {
            background: #1e1e3a;
            color: #94a3b8;
            border: 1px solid #2a2a4a;
        }
        .btn-copy:active, .btn-clear:active { transform: scale(0.96); }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }
        .stat {
            background: #0d0d1a;
            padding: 10px 6px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #1a1a3a;
        }
        .stat .num {
            font-size: 1.4rem;
            font-weight: 700;
            color: #a855f7;
        }
        .stat .label {
            font-size: 0.65rem;
            color: #64748b;
            margin-top: 2px;
        }
        .result-box {
            background: #0d0d1a;
            border-radius: 14px;
            padding: 18px;
            border: 1px solid #1a1a3a;
            max-height: 400px;
            overflow: auto;
            display: none;
            margin-top: 10px;
        }
        .result-box.show { display: block; }
        .result-box pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #c4b5fd;
            margin: 0;
            line-height: 1.6;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading.show { display: block; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #1a1a3a;
            border-top: 4px solid #a855f7;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #4ade80;
            font-size: 0.85rem;
            border-top: 1px solid #1a1a3a;
            padding-top: 15px;
        }
        .method-status {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
            justify-content: center;
        }
        .method-status .method {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid #2a2a4a;
        }
        .method-status .method.success {
            border-color: #4ade80;
            color: #4ade80;
        }
        .method-status .method.fail {
            border-color: #f87171;
            color: #f87171;
        }
        @media (max-width: 500px) {
            h1 { font-size: 1.6rem; }
            .container { padding: 18px 12px; }
            textarea { height: 130px; font-size: 0.85rem; }
            .badge { font-size: 0.55rem; padding: 1px 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔓 أبو شنب يرحب بك</h1>
    <p class="sub">أقوى أداة لفك التشفير والتشويش (مع APIs خارجية)</p>
    
    <div class="badges">
        <span class="badge">string.char</span>
        <span class="badge">base64</span>
        <span class="badge">Hex</span>
        <span class="badge">URL</span>
        <span class="badge">ROT13</span>
        <span class="badge">XOR</span>
        <span class="badge">Caesar</span>
        <span class="badge">Reverse</span>
        <span class="badge">JSON</span>
        <span class="badge">HTML entities</span>
        <span class="badge">Unicode</span>
        <span class="badge">JWT</span>
        <span class="badge external">de4js</span>
        <span class="badge external">luadec</span>
        <span class="badge external">CyberChef</span>
        <span class="badge external">REstringer</span>
        <span class="badge external">webcrack</span>
    </div>

    <textarea id="inputCode" placeholder="الصق السكربت المشفر هنا...">loadstring(string.char(104,116,116,112,115,58,47,47,101,120,97,109,112,108,101,46,99,111,109))()</textarea>

    <div class="buttons">
        <button class="btn-decrypt" id="decryptBtn">⚡ فك التشفير (جميع الطرق)</button>
        <button class="btn-copy" id="copyBtn">📋 نسخ</button>
        <button class="btn-clear" id="clearBtn">🗑️ مسح</button>
    </div>

    <div class="method-status" id="methodStatus"></div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 12px; color: #94a3b8; font-size: 0.95rem;">جاري فك التشفير بجميع الطرق...</p>
    </div>

    <div class="stats" id="statsContainer"></div>

    <div class="result-box" id="resultBox">
        <pre id="outputResult"></pre>
    </div>

    <div class="footer">🔒 بياناتك بآمان، ما تحفظ · جميع العمليات في متصفحك</div>
</div>

<script>
    (function() {
        'use strict';

        // ============================================================
        // 🔥 جميع طرق فك التشفير (داخل المتصفح + APIs خارجية)
        // ============================================================

        // ------ الأدوات الداخلية (تشتغل في المتصفح) ------
        const internalMethods = {
            stringchar: function(code) {
                try {
                    return code.replace(/string\.char\(([^)]*)\)/g, (_, args) => {
                        const chars = args.match(/\d+/g);
                        if (!chars) return _;
                        return '"' + chars.map(c => String.fromCharCode(+c)).join('') + '"';
                    });
                } catch { return null; }
            },
            base64: function(code) {
                try {
                    let result = code.replace(/base64\.decode\(["']([^"']+)["']\)/g, (_, str) => {
                        try { return `"${atob(str)}"`; } catch { return _; }
                    });
                    result = result.replace(/["']([A-Za-z0-9+/=]{20,})["']/g, (_, str) => {
                        try { return `"${atob(str)}"`; } catch { return _; }
                    });
                    return result;
                } catch { return null; }
            },
            hex: function(code) {
                try {
                    return code.replace(/string\.fromCharCode\(0x[^)]*\)/g, (match) => {
                        const hex = match.match(/0x([0-9a-f]+)/gi);
                        if (!hex) return match;
                        return '"' + hex.map(h => String.fromCharCode(parseInt(h, 16))).join('') + '"';
                    });
                } catch { return null; }
            },
            url: function(code) {
                try {
                    return code.replace(/%[0-9A-Fa-f]{2}/g, (match) => {
                        try { return decodeURIComponent(match); } catch { return match; }
                    });
                } catch { return null; }
            },
            rot13: function(code) {
                try {
                    return code.replace(/rot13\(["']([^"']+)["']\)/g, (_, str) => {
                        return '"' + str.replace(/[a-zA-Z]/g, c => {
                            const code = c.charCodeAt(0);
                            const base = code <= 90 ? 65 : 97;
                            return String.fromCharCode((code - base + 13) % 26 + base);
                        }) + '"';
                    });
                } catch { return null; }
            },
            xor: function(code) {
                try {
                    return code.replace(/xor\(["']([^"']+)["'],\s*(\d+)\)/g, (_, str, key) => {
                        const k = +key;
                        return '"' + str.split('').map(c => String.fromCharCode(c.charCodeAt(0) ^ k)).join('') + '"';
                    });
                } catch { return null; }
            },
            caesar: function(code) {
                try {
                    return code.replace(/caesar\(["']([^"']+)["'],\s*(\d+)\)/g, (_, str, shift) => {
                        const s = +shift;
                        return '"' + str.replace(/[a-zA-Z]/g, c => {
                            const code = c.charCodeAt(0);
                            const base = code <= 90 ? 65 : 97;
                            return String.fromCharCode((code - base + s) % 26 + base);
                        }) + '"';
                    });
                } catch { return null; }
            },
            reverse: function(code) {
                try {
                    return code.replace(/reverse\(["']([^"']+)["']\)/g, (_, str) => {
                        return '"' + str.split('').reverse().join('') + '"';
                    });
                } catch { return null; }
            },
            json: function(code) {
                try {
                    return code.replace(/json\.parse\(["']([^"']+)["']\)/g, (_, str) => {
                        try { return JSON.stringify(JSON.parse(str), null, 2); } catch { return _; }
                    });
                } catch { return null; }
            },
            html: function(code) {
                try {
                    const entities = {
                        '&lt;': '<', '&gt;': '>', '&amp;': '&', '&quot;': '"',
                        '&apos;': "'", '&nbsp;': ' ', '&copy;': '©', '&reg;': '®'
                    };
                    return code.replace(/&[a-zA-Z]+;/g, m => entities[m] || m);
                } catch { return null; }
            },
            unicode: function(code) {
                try {
                    return code.replace(/\\u([0-9a-f]{4})/gi, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
                } catch { return null; }
            },
            jwt: function(code) {
                try {
                    return code.replace(/([A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+)/g, (match) => {
                        try {
                            const parts = match.split('.');
                            const header = JSON.parse(atob(parts[0]));
                            const payload = JSON.parse(atob(parts[1]));
                            return JSON.stringify({ header, payload }, null, 2);
                        } catch { return match; }
                    });
                } catch { return null; }
            }
        };

        // ------ الأدوات الخارجية (APIs) ------
        const externalAPIs = {
            de4js: async function(code) {
                try {
                    const response = await fetch('https://de4js.lelinhtinh.com/api/deobfuscate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: code })
                    });
                    const data = await response.json();
                    return data.result || null;
                } catch { return null; }
            },
            luadec: async function(code) {
                try {
                    const response = await fetch('https://luadec.metaworm.site/api/decompile', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: code })
                    });
                    const data = await response.json();
                    return data.result || null;
                } catch { return null; }
            },
            cyberchef: async function(code) {
                try {
                    // CyberChef API (بسيطة)
                    const response = await fetch('https://gchq.github.io/CyberChef/api/bake', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            input: code,
                            recipe: [{
                                op: 'From Base64',
                                args: ['A-Za-z0-9+/=', true]
                            }]
                        })
                    });
                    const data = await response.json();
                    return data.result || null;
                } catch { return null; }
            },
            restringer: async function(code) {
                try {
                    const response = await fetch('https://restringer.vercel.app/api/deobfuscate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: code })
                    });
                    const data = await response.json();
                    return data.result || null;
                } catch { return null; }
            },
            webcrack: async function(code) {
                try {
                    const response = await fetch('https://webcrack.vercel.app/api/unpack', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: code })
                    });
                    const data = await response.json();
                    return data.result || null;
                } catch { return null; }
            }
        };

        // ============================================================
        // 🎮 واجهة المستخدم
        // ============================================================

        const inputEl = document.getElementById('inputCode');
        const decryptBtn = document.getElementById('decryptBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const resultBox = document.getElementById('resultBox');
        const outputEl = document.getElementById('outputResult');
        const statsContainer = document.getElementById('statsContainer');
        const loadingEl = document.getElementById('loading');
        const methodStatus = document.getElementById('methodStatus');

        async function decryptAll() {
            const code = inputEl.value.trim();
            if (!code) {
                alert('الرجاء إدخال سكربت لفك التشفير.');
                return;
            }

            loadingEl.classList.add('show');
            resultBox.classList.remove('show');
            methodStatus.innerHTML = '';
            decryptBtn.disabled = true;
            decryptBtn.textContent = '⏳ جاري...';

            let results = [];
            let finalResult = code;

            // 1. تشغيل الأدوات الداخلية
            for (const [name, fn] of Object.entries(internalMethods)) {
                try {
                    const result = fn(finalResult);
                    if (result && result !== finalResult) {
                        results.push({ method: name, success: true });
                        finalResult = result;
                    } else {
                        results.push({ method: name, success: false });
                    }
                } catch (e) {
                    results.push({ method: name, success: false });
                }
            }

            // 2. تشغيل الأدوات الخارجية (APIs)
            for (const [name, fn] of Object.entries(externalAPIs)) {
                try {
                    const result = await fn(finalResult);
                    if (result && result !== finalResult) {
                        results.push({ method: name, success: true });
                        finalResult = result;
                    } else {
                        results.push({ method: name, success: false });
                    }
                } catch (e) {
                    results.push({ method: name, success: false });
                }
            }

            // عرض حالة كل طريقة
            methodStatus.innerHTML = results.map(r => 
                `<span class="method ${r.success ? 'success' : 'fail'}">${r.method} ${r.success ? '✅' : '❌'}</span>`
            ).join('');

            // عرض النتيجة النهائية
            outputEl.textContent = finalResult || '⚠️ لا يوجد كود لفك التشفير.';
            resultBox.classList.add('show');

            // إحصائيات
            const successCount = results.filter(r => r.success).length;
            const totalCount = results.length;
            statsContainer.innerHTML = `
                <div class="stat"><div class="num">${successCount}/${totalCount}</div><div class="label">نجحت</div></div>
